<style>
:root{
  --bg:#f5f3ef;--card:#ffffff;--ink:#1d2321;--mute:#6b7471;--line:#e4e0d8;
  --brand:#1f6f6b;--brand-ink:#ffffff;--brand-soft:#e3f0ee;
  --gift:#b4582b;--gift-soft:#fbeee6;--bad:#c23b3b;--bad-soft:#fbeaea;--warn:#a86b00;--warn-soft:#fff4dc;--ok:#2f7d4f;
  --r:14px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817;--card:#1d2321;--ink:#eef2f0;--mute:#9aa5a1;--line:#2c3431;
  --brand:#4fb3a9;--brand-ink:#0d1413;--brand-soft:#1f3532;--gift:#f0955f;--gift-soft:#3a2619;--bad:#f07272;--bad-soft:#3a1f1f;--warn:#f2b84b;--warn-soft:#3a2f17;--ok:#6cc792;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141817;--card:#1d2321;--ink:#eef2f0;--mute:#9aa5a1;--line:#2c3431;
  --brand:#4fb3a9;--brand-ink:#0d1413;--brand-soft:#1f3532;--gift:#f0955f;--gift-soft:#3a2619;--bad:#f07272;--bad-soft:#3a1f1f;--warn:#f2b84b;--warn-soft:#3a2f17;--ok:#6cc792;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main.wrap{padding:14px 16px calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top))}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto;margin:0 -4px}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}

button.alert{display:block;width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.rfrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rfrow:last-of-type{border-bottom:0}
.rfrow .info{flex:1;min-width:0}
.need{font-weight:700;font-size:14px;padding:3px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
textarea.rfmsg{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:380px}
.brand{font-size:26px;font-weight:700;color:var(--brand);text-align:center;margin-bottom:2px;letter-spacing:.5px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pinpad button{height:58px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:600}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.dots i.on{background:var(--brand)}
.evlist button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.evlist b{display:block;font-size:17px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.pricerow{display:grid;grid-template-columns:42px 1fr 84px 40px 40px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pricerow input[type=number]{min-height:40px;padding:6px 8px;text-align:right}
.pricerow .c{display:grid;place-items:center}
.pricerow .c input{width:22px;height:22px;accent-color:var(--brand)}
.hide{display:none!important}
.thumb{width:56px;height:56px;border-radius:10px;background:#fff;border:1px solid var(--line);flex-shrink:0;display:grid;place-items:center;overflow:hidden;color:var(--mute);font-weight:700;font-size:18px}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.s{width:42px;height:42px;font-size:15px;border-radius:8px}
</style>

<body>
<div id="app"></div>
<script>
/* ===== MINANA Stock – core logic (ใช้ร่วมกันทั้ง Apps Script และโหมดทดลองในเบราว์เซอร์) =====
 * หลักการ: สต๊อกไม่ถูกเก็บเป็นตัวเลขคงเหลือ แต่คำนวณจากสมุดรายการ (Ledger) ที่เพิ่มต่อท้ายอย่างเดียว
 * - ทุกงาน/คลัง เป็น "location" ของตัวเอง  -> งานซ้อนกันไม่ปนกัน
 * - เบิก/คืน = 2 แถวคู่ (ออกจากที่หนึ่ง เข้าอีกที่)
 * - ทุกบิลมี client_id -> ส่งซ้ำ (เน็ตหลุดแล้วส่งใหม่) ไม่ถูกบันทึกซ้ำ
 */
var CORE = (function () {
  var SHEETS = {
    Products: ['barcode', 'name', 'color', 'category', 'price', 'active', 'image'],
    Staff: ['name', 'pin', 'role', 'active'],
    Events: ['event_id', 'name', 'store', 'start', 'end', 'status', 'created_at', 'closed_at', 'lead_days'],
    EventPrices: ['event_id', 'barcode', 'price', 'sell_ok', 'gift_ok'],
    Ledger: ['ts', 'client_id', 'bill_id', 'location', 'type', 'barcode', 'qty', 'unit_price', 'amount', 'pay', 'staff', 'note']
  };
  var WH = 'WH';
  var TYPE_LABEL = {
    SALE: 'ขาย', GIFT: 'แถม', XFER_IN: 'รับเข้า', XFER_OUT: 'ส่งออก',
    ADJ: 'ปรับยอด', VOID: 'ยกเลิกบิล'
  };

  function UserError(msg) { var e = new Error(msg); e.userError = true; return e; }
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function bool(v) { var s = str(v).toUpperCase(); return s === 'TRUE' || s === '1' || s === 'Y' || s === 'YES' || v === true; }
  function nowTH() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 19).replace('T', ' '); }
  var CLOCK = function () { return Date.now(); };
  var DAY = 864e5;
  function thDate(v) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str(v)); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) - 7 * 3600e3 : null; }
  function leadOf(ev) { var n = Math.round(num(ev.lead_days)); return n > 0 ? n : 2; }
  function packOf(p) { return /ผ้าอ้อม/.test(p.category + ' ' + p.name) ? 6 : 1; }
  /* เตือนเติมของ แบบ A (อัตโนมัติ): ใช้ยอดออกจริง (ขาย+แถม-ยกเลิก) ÷ จำนวนวันที่ผ่านไป */
  function refillPlan(ledger, ev, list) {
    var loc = str(ev.event_id), now = CLOCK(), lead = leadOf(ev);
    var t0 = thDate(ev.start), t1 = thDate(ev.end);
    var used = {};
    ledger.forEach(function (r) {
      if (str(r.location) !== loc) return;
      if (r.type === 'SALE' || r.type === 'GIFT' || r.type === 'VOID') { var b = str(r.barcode); used[b] = (used[b] || 0) - num(r.qty); }
    });
    var end = t1 != null ? t1 + DAY : null;
    var elapsed = t0 == null ? 1 : Math.max(0.5, ((end != null ? Math.min(now, end) : now) - t0) / DAY);
    var left = end == null ? null : Math.max(0, (end - now) / DAY);
    var horizon = left == null ? lead + 1 : left;
    var items = [];
    list.forEach(function (p) {
      var u = Math.max(0, used[p.barcode] || 0), v = u / elapsed, pk = packOf(p);
      p.used = u; p.per_day = Math.round(v * 100) / 100; p.pack = pk;
      p.days_cover = v > 0 ? Math.round(Math.max(0, p.stock) / v * 10) / 10 : null;
      p.left_end = left == null ? null : Math.round(p.stock - v * left);
      p.refill = 0;
      if (v <= 0 || horizon <= 0) return;
      var thr = Math.ceil(v * lead), need = Math.ceil(v * horizon - p.stock);
      if (p.stock <= thr && need > 0) { p.refill = Math.ceil(need / pk) * pk; p.alert_at = thr; items.push(p.barcode); }
    });
    items.sort(function (a, b) {
      var A1 = list.filter(function (x) { return x.barcode === a; })[0], B1 = list.filter(function (x) { return x.barcode === b; })[0];
      return (A1.days_cover || 0) - (B1.days_cover || 0);
    });
    return { lead_days: lead, days_left: left == null ? null : Math.round(left * 10) / 10, days_elapsed: Math.round(elapsed * 10) / 10, alerts: items };
  }
  function rid(p) { return p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }

  function auth(db, p, adminOnly) {
    var s = db.read('Staff').filter(function (r) {
      return str(r.name) === str(p.staff) && str(r.active).toUpperCase() !== 'FALSE';
    })[0];
    if (!s || str(s.pin) !== str(p.pin)) throw UserError('ชื่อหรือ PIN ไม่ถูกต้อง');
    var role = str(s.role).toLowerCase() || 'pc';
    if (adminOnly && role !== 'admin') throw UserError('ต้องใช้สิทธิ์แอดมิน');
    return { name: str(s.name), role: role };
  }

  function getEvent(db, id) {
    var ev = db.read('Events').filter(function (r) { return str(r.event_id) === str(id); })[0];
    if (!ev) throw UserError('ไม่พบงาน ' + id);
    return ev;
  }
  function requireOpen(ev) { if (str(ev.status) !== 'open') throw UserError('งาน "' + ev.name + '" ปิดแล้ว บันทึกเพิ่มไม่ได้'); }

  function products(db) {
    var m = {};
    db.read('Products').forEach(function (r) {
      var b = str(r.barcode); if (!b) return;
      m[b] = { barcode: b, name: str(r.name), color: str(r.color), category: str(r.category), price: num(r.price), active: str(r.active).toUpperCase() !== 'FALSE', image: str(r.image), _row: r._row };
    });
    return m;
  }

  function stockAt(ledger, loc) {
    var s = {};
    ledger.forEach(function (r) { if (str(r.location) === loc) { var b = str(r.barcode); s[b] = (s[b] || 0) + num(r.qty); } });
    return s;
  }

  function seenClient(ledger, cid) {
    if (!cid) return null;
    for (var i = ledger.length - 1; i >= 0; i--) if (str(ledger[i].client_id) === cid) return ledger[i];
    return null;
  }

  function cleanItems(items) {
    var out = [];
    (items || []).forEach(function (it) {
      var q = Math.round(num(it.qty));
      if (str(it.barcode) && q > 0) out.push({ barcode: str(it.barcode), qty: q, mode: it.mode === 'gift' ? 'gift' : 'sale' });
    });
    if (!out.length) throw UserError('ยังไม่มีรายการสินค้า');
    return out;
  }

  /* ---------- actions ---------- */
  var A = {};

  A.bootstrap = function (db) {
    return {
      staff: db.read('Staff').filter(function (r) { return str(r.name) && str(r.active).toUpperCase() !== 'FALSE'; }).map(function (r) { return str(r.name); }),
      events: db.read('Events').filter(function (r) { return str(r.status) === 'open'; }).map(function (r) { return { event_id: str(r.event_id), name: str(r.name), store: str(r.store), start: str(r.start), end: str(r.end) }; })
    };
  };

  A.login = function (db, p) { var u = auth(db, p); return { user: u }; };

  A.events = function (db, p) {
    auth(db, p);
    return { events: db.read('Events').map(function (r) { return { event_id: str(r.event_id), name: str(r.name), store: str(r.store), start: str(r.start), end: str(r.end), status: str(r.status) }; }) };
  };

  A.state = function (db, p) {
    auth(db, p);
    var ev = getEvent(db, p.event_id);
    var pm = products(db), ledger = db.read('Ledger');
    var st = stockAt(ledger, str(ev.event_id)), wh = stockAt(ledger, WH);
    var prices = {};
    db.read('EventPrices').forEach(function (r) { if (str(r.event_id) === str(ev.event_id)) prices[str(r.barcode)] = r; });
    var list = [];
    Object.keys(pm).forEach(function (b) {
      var pr = prices[b], prod = pm[b];
      var inEvent = !!pr || (st[b] || 0) !== 0;
      if (!inEvent) return;
      list.push({
        barcode: b, name: prod.name, color: prod.color, category: prod.category,
        price: pr ? num(pr.price) : 0, sell_ok: prod.active && pr ? bool(pr.sell_ok) && num(pr.price) > 0 : false,
        gift_ok: prod.active && pr ? bool(pr.gift_ok) : false, active: prod.active, stock: st[b] || 0, wh: wh[b] || 0
      });
    });
    var plan = refillPlan(ledger, ev, list);
    return { event: { event_id: str(ev.event_id), name: str(ev.name), store: str(ev.store), start: str(ev.start), end: str(ev.end), status: str(ev.status), lead_days: leadOf(ev) }, products: list, refill: plan, summary: summarize(ledger, str(ev.event_id), pm), server_time: nowTH() };
  };

  A.sell = function (db, p) {
    var u = auth(db, p);
    return db.lock(function () {
      var ledger = db.read('Ledger');
      var dup = seenClient(ledger, str(p.client_id));

<script>

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set(k, v) { MEM[k] = JSON.stringify(v); try { localStorage.setItem(k, MEM[k]); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = s => document.querySelector(s);

async function loadUploadedImages(force) {
  try {
    const all = await ensureProducts(force);
    const need = all.filter(p => p.has_image && (force || !UPIMG[p.barcode])).map(p => p.barcode);
    if (!need.length) return;
    const r = await api(Object.assign({ action: 'images', barcodes: need }, auth()));
    if (r.ok) { Object.assign(UPIMG, r.images); LS.set('ms_upimg', UPIMG); if (ST) renderView(); }
  } catch (e) {}
}
const IMG_BASE = 'img/';   // รูปสินค้าในโฟลเดอร์ img/ ชื่อไฟล์ = บาร์โค้ด.jpg
function thumb(b, name, small) {
  const src = UPIMG[b] || IMGS[b] || (IMGS.__none ? '' : IMG_BASE + encodeURIComponent(b) + '.jpg');
  const rest = String(name || '?').replace(/^(ผ้าอ้อมเด็ก|ผ้าอ้อม|รถเข็นเด็ก|รถเข็น|กระเป๋า|เก้าอี้|เบาะรองนั่ง)\s*/, '');
  const code = rest.match(/[A-Za-z0-9]+/);
  const ini = esc(code && /\d/.test(code[0]) ? code[0].slice(0, 4) : rest.slice(0, 2));
  return `<div class="thumb ${small ? 's' : ''}">${src ? `<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.textContent='${ini}'">` : ini}</div>`;
}

/* ================== api ================== */
class NetErr extends Error {}
async function api(p, quiet) {
  if (API === 'demo') { await new Promise(r => setTimeout(r, 120)); return JSON.parse(JSON.stringify(CORE.handle(demoDb(), p))); }
  let r;
  try {
    r = await fetch(API, { method: 'POST', body: JSON.stringify(p), redirect: 'follow' });
  } catch (e) { throw new NetErr('ออฟไลน์'); }
  if (!r.ok) throw new NetErr('เซิร์ฟเวอร์ตอบกลับ ' + r.status);
  try { return await r.json(); } catch (e) { throw new NetErr('อ่านข้อมูลจากเซิร์ฟเวอร์ไม่ได้'); }
}
const auth = () => ({ staff: S.staff, pin: S.pin });

/* ================== offline queue ================== */
function saveQ() { LS.set('ms_queue', Q); renderHeader(); }
let syncing = false;
async function syncQueue() {
  if (syncing || !Q.length) return;
  syncing = true;
  try {
    for (const item of Q.filter(x => x.status === 'pending')) {
      let res;
      try { res = await api(item.payload); } catch (e) { break; }
      if (res.ok) { Q = Q.filter(x => x !== item); if (res.warnings && res.warnings.length) toast('⚠️ ' + res.warnings[0]); }
      else { item.status = 'failed'; item.error = res.error; }
      saveQ();
    }
  } finally { syncing = false; }
  if (S && S.event_id) loadState(true);
}
window.addEventListener('online', syncQueue);
setInterval(() => { syncQueue(); if (S && S.event_id && TAB === 'sell' && !document.hidden && !$('.sheet-bg')) loadState(true); }, 30000);

/* ================== ui helpers ================== */
let toastT;
function toast(m, ms) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = m; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', ms || 2600); }
function sheet(html) { closeSheet(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = '<div class="sheet">' + html + '</div>'; bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); }); document.body.appendChild(bg); return bg; }
function closeSheet() { stopScan(); document.querySelectorAll('.sheet-bg:not(.ask-bg)').forEach(x => x.remove()); }
function ask(msg, opt) {
  opt = opt || {};
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg ask-bg';
    bg.innerHTML = `<div class="sheet" style="max-width:440px;border-radius:18px;margin:auto 12px">
      <p style="white-space:pre-line;margin:4px 0 12px;font-weight:600">${esc(msg)}</p>
      ${opt.input ? '<input type="text" id="askin" placeholder="' + esc(opt.placeholder || '') + '">' : ''}
      <div class="row2" style="margin-top:14px"><button class="btn line" data-r="0">${esc(opt.no || 'ยกเลิก')}</button><button class="btn ${opt.danger ? 'danger' : ''}" data-r="1">${esc(opt.yes || 'ตกลง')}</button></div></div>`;
    bg.style.alignItems = 'center';
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    bg.querySelector('[data-r="0"]').onclick = () => done(opt.input ? null : false);
    bg.querySelector('[data-r="1"]').onclick = () => done(opt.input ? (bg.querySelector('#askin').value || '') : true);
    if (opt.input) setTimeout(() => bg.querySelector('#askin').focus(), 50);

async function loadState(quiet) {

function applyQueueLocally() {

    (x.payload.items || []).forEach(it => { const p = ST.products.find(p => p.barcode === it.barcode); if (p) p.stock += (x.payload.action === 'sell' ? -1 : 1) * it.qty; });

const closedGuard = () => ST.event.status !== 'open' ? '<div class="alert bad">งานนี้ปิดแล้ว ดูข้อมูลได้อย่างเดียว</div>' : '';

/* ================== REFILL ALERT (แบบ A อัตโนมัติ) ================== */
function rfAlerts() { const r = ST && ST.refill; if (!r || ST.event.status !== 'open') return []; return (r.alerts || []).map(b => ST.products.find(p => p.barcode === b)).filter(Boolean); }
function short(p) { return (p.name + ' ' + (p.color || '')).replace('ผ้าอ้อมเด็ก ', 'ผ้าอ้อม ').trim(); }
function coverTxt(p) { return p.days_cover == null ? 'ยังไม่มียอดออก' : p.days_cover < 1 ? 'ไม่ถึงวัน' : 'พอ ~' + (p.days_cover < 3 ? p.days_cover : Math.round(p.days_cover)) + ' วัน'; }
function refillBanner() {
  const a = rfAlerts(); if (!a.length) return '';
  return `<button class="alert warn" onclick="goRefill()">⚠ ควรเบิกคลัง ${a.length} รายการ: ${a.slice(0, 3).map(p => esc(short(p)) + ' เหลือ ' + p.stock).join(' · ')}${a.length > 3 ? ' …' : ''} <b>ดู ›</b></button>`;
}
function goRefill() { TAB = 'refill'; viewRefill.dir = 'in'; renderTabs(); renderView(); window.scrollTo(0, 0); }
function refillMsg(a) {
  const groups = {};
  a.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
  let t = 'เบิกคลัง · ' + ST.event.name + (ST.event.store ? ' (' + ST.event.store + ')' : '') + '\n';
  Object.keys(groups).forEach(c => {
    t += '\n' + c + '\n' + groups[c].map(p => '- ' + short(p) + ' ' + p.refill + (p.pack > 1 ? ' แพ็ค (' + (p.refill / p.pack) + ' ห่อ)' : ' ชิ้น')).join('\n') + '\n';
  });
  t += '\nรวม ' + Object.keys(groups).map(c => c + ' ' + groups[c].reduce((s, p) => s + p.refill, 0)).join(' · ');
  return t;
}
function refillCard() {
  const r = ST.refill; if (!r || ST.event.status !== 'open') return '';
  const a = rfAlerts();
  const basis = `<p class="small muted" style="margin:6px 0 0">คิดจาก ยอดออกเฉลี่ยต่อวัน × คลังส่งถึงใน ${r.lead_days} วัน · ผ่านไป ${r.days_elapsed} วัน${r.days_left != null ? ' · เหลืออีก ' + r.days_left + ' วัน' : ''}</p>`;
  const over = ST.products.filter(p => p.used > 0 && p.left_end != null && p.left_end >= Math.max(3, p.pack * 2)).sort((x, y) => y.left_end - x.left_end).slice(0, 6);
  const overHtml = over.length ? `<div class="alert ok" style="margin-top:10px">↩ คาดว่าจะเหลือตอนปิดงาน: ${over.map(p => esc(short(p)) + ' ~' + p.left_end).join(' · ')}</div>` : '';
  if (!a.length) return `<div class="card"><h2 style="margin:0">ต้องเบิกจากคลัง</h2><div class="alert ok">✓ ของพอขาย ยังไม่ต้องเบิก</div>${basis}${overHtml}</div>`;
  return `<div class="card"><h2 style="margin:0 0 4px">ต้องเบิกจากคลัง <span class="muted" style="font-size:15px">${a.length} รายการ</span></h2>
    ${a.map(p => `<div class="rfrow">${thumb(p.barcode, p.name, true)}<div class="info"><b>${esc(p.name)}</b> <span class="muted">${esc(p.color)}</span><div class="small muted">เหลือ ${p.stock} · ออกวันละ ${p.per_day} · ${coverTxt(p)}</div></div><span class="need">เบิก ${p.refill}</span></div>`).join('')}
    ${basis}
    <label class="f" for="rfmsg">ข้อความเบิกคลัง (ส่ง LINE)</label>
    <textarea class="rfmsg" id="rfmsg" readonly>${esc(refillMsg(a))}</textarea>
    <div class="row2" style="margin-top:8px"><button class="btn ghost" id="rfcopy">คัดลอกข้อความ</button><button class="btn line" id="rffill">ใส่ในรายการรับของ</button></div>
    ${overHtml}</div>`;
}
function bindRefillCard() {
  const a = rfAlerts();
  if ($('#rfcopy')) $('#rfcopy').onclick = () => {
    const ta = $('#rfmsg'), t = ta.value;
    const fallback = () => { ta.focus(); ta.select(); toast('กดค้างที่ข้อความแล้วเลือกคัดลอก'); };
    try { navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว ไปวางใน LINE ได้เลย'), fallback); } catch (e) { fallback(); }
  };
  if ($('#rffill')) $('#rffill').onclick = () => {

    viewRefill(); toast('ใส่ ' + a.length + ' รายการแล้ว แก้จำนวนตามของที่ได้รับจริงก่อนกดบันทึก', 3500);
  };
}

/* ================== SELL ================== */
function cats() { return ['ทั้งหมด'].concat([...new Set(ST.products.map(p => p.category))]); }
function filtered(list) {
  const s = SEARCH.trim().toLowerCase();
  return list.filter(p => (CAT === 'ทั้งหมด' || p.category === CAT) && hit(s, p.name, p.color, p.barcode, p.category));
}
function stockCls(n) { return n <= 0 ? 'out' : n <= 3 ? 'low' : ''; }
function inCart(b, mode) { return CART.filter(x => x.barcode === b && (!mode || x.mode === mode)).reduce((a, x) => a + x.qty, 0); }
function viewSell() {
  const list = filtered(ST.products.filter(p => p.sell_ok || p.gift_ok));
  $('#view').innerHTML = closedGuard() + refillBanner() + `
    <div class="searchbar"><input type="search" id="q" placeholder="ค้นหาชื่อ / สี / บาร์โค้ด" value="${esc(SEARCH)}"><button class="scanbtn" onclick="openScan()" aria-label="สแกน">${ICON.scan}</button></div>
    <div class="chips">${cats().map(c => `<button class="chip ${c === CAT ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="plist">${list.map(p => {
      const left = p.stock - inCart(p.barcode);
      return `<div class="prod">${thumb(p.barcode, p.name)}<div class="info"><div class="nm">${esc(p.name)} ${p.color ? '<span class="muted" style="font-weight:500">' + esc(p.color) + '</span>' : ''}</div>
        <div class="meta"><span class="stock ${stockCls(left)}">เหลือ ${left}</span>${p.sell_ok ? '<span>฿' + fmt(p.price) + '</span>' : '<span>ของแถม</span>'}${inCart(p.barcode) ? '<span>🛒 ' + inCart(p.barcode) + '</span>' : ''}</div></div>
        <div class="add">${p.sell_ok ? `<button data-b="${p.barcode}" data-m="sale">+ขาย</button>` : ''}${p.gift_ok ? `<button class="g" data-b="${p.barcode}" data-m="gift">+แถม</button>` : ''}</div></div>`;
    }).join('') || '<div class="empty">ไม่พบสินค้า' + (ST.products.length ? '' : ' – แอดมินยังไม่ได้ตั้งราคาสินค้าในงานนี้') + '</div>'}</div>`;
  const q = $('#q'); q.oninput = e => { SEARCH = e.target.value; const pos = q.selectionStart; viewSell(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  q.onkeydown = e => { if (e.key === 'Enter') { const b = SEARCH.trim(); const p = ST.products.find(x => x.barcode === b); if (p) { SEARCH = ''; addToCart(p, p.sell_ok ? 'sale' : 'gift'); } } };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { CAT = b.dataset.c; viewSell(); });
  document.querySelectorAll('.add button').forEach(b => b.onclick = () => addToCart(ST.products.find(p => p.barcode === b.dataset.b), b.dataset.m));
}
function addToCart(p, mode, n) {
  if (!p) return;
  if (ST.event.status !== 'open') return toast('งานปิดแล้ว');
  if (mode === 'sale' && !p.sell_ok) mode = 'gift';
  if (mode === 'gift' && !p.gift_ok) mode = 'sale';
  if (mode === 'sale' && !p.sell_ok) return toast('สินค้านี้ยังไม่ได้ตั้งราคาในงานนี้');
  const left = p.stock - inCart(p.barcode);
  const push = () => {
    const line = CART.find(x => x.barcode === p.barcode && x.mode === mode);
    if (line) line.qty += n || 1; else CART.push({ barcode: p.barcode, qty: n || 1, mode });
    saveCart(); vibrate(); toast((mode === 'gift' ? '🎁 แถม ' : '🛒 ') + p.name + ' ' + p.color, 1200);
    if (TAB === 'sell' && !document.querySelector('.sheet-bg')) viewSell();
    if (document.querySelector('#scanmsg')) document.querySelector('#scanmsg').textContent = '✅ ' + p.name + ' ' + p.color + ' (ในตะกร้า ' + inCart(p.barcode) + ')';
  };

let scanner = null, lastScan = { code: '', t: 0 };
function openScan(target) {
  const bg = sheet(`<div class="hd"><h2 style="margin:0">สแกนบาร์โค้ด</h2><button class="btn line" onclick="closeSheet()">เสร็จ</button></div>
    <div id="reader"></div><p class="small muted" id="scanmsg">เล็งกล้องไปที่บาร์โค้ดบนกล่อง/ป้าย</p>
    ${target === 'refill' ? '' : `<div class="seg" id="scanmode"><button class="on" data-m="sale">สแกน = ขาย</button><button data-m="gift">สแกน = แถม</button></div>`}`);
  let mode = 'sale';
  bg.querySelectorAll('#scanmode button').forEach(b => b.onclick = () => { mode = b.dataset.m; bg.querySelectorAll('#scanmode button').forEach(x => x.classList.toggle('on', x === b)); });
  if (!window.Html5Qrcode) { $('#scanmsg').textContent = 'โหลดตัวสแกนไม่สำเร็จ – พิมพ์บาร์โค้ดในช่องค้นหาแทน'; return; }
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.CODE_128, F.UPC_A], verbose: false });
  scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: 280, height: 140 } }, code => {
    const now = Date.now(); if (code === lastScan.code && now - lastScan.t < 1800) return; lastScan = { code, t: now };
    if (target === 'refill') { refillAdd(code); return; }
    const p = ST.products.find(x => x.barcode === code);
    if (!p) { $('#scanmsg').textContent = '❌ ' + code + ' ไม่มีในงานนี้'; vibrate(); return; }
    addToCart(p, mode);
  }).catch(e => { $('#scanmsg').textContent = 'เปิดกล้องไม่ได้: อนุญาตการใช้กล้องในเบราว์เซอร์ หรือพิมพ์บาร์โค้ดแทน'; });
}
function stopScan() { if (scanner) { const s = scanner; scanner = null; s.stop().catch(() => {}).finally(() => { try { s.clear(); } catch (e) {} }); } if (TAB === 'sell' && $('#view') && ST) setTimeout(() => { if (!$('.sheet-bg')) viewSell(); }, 50); }

function resizeImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const N = 240, c = document.createElement('canvas'); c.width = N; c.height = N; const x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, N, N);
      const k = Math.min(N / im.width, N / im.height); const w = im.width * k, h = im.height * k;
      x.drawImage(im, (N - w) / 2, (N - h) / 2, w, h); res(c.toDataURL('image/jpeg', 0.75));
    }; im.onerror = () => rej(new Error('เปิดรูปไม่ได้')); im.src = fr.result; };
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); fr.readAsDataURL(file);
  });
}

function queueSheet() {
  const bg = sheet(`<div class="hd"><h2 style="margin:0">รายการรอส่ง</h2><button class="btn line" onclick="closeSheet()">ปิด</button></div>
    ${Q.map((x, i) => `<div class="ln"><div class="info"><b>${esc(x.label || x.payload.action)}</b><div class="small muted">${esc(x.created)} · ${x.status === 'pending' ? 'รอเน็ต' : '<span style="color:var(--bad)">ส่งไม่ผ่าน: ' + esc(x.error) + '</span>'}</div></div>${x.status === 'failed' ? `<button class="btn line" style="min-height:34px" data-del="${i}">ลบ</button>` : ''}</div>`).join('') || '<div class="empty">ไม่มีรายการค้าง</div>'}
    ${Q.length ? '<button class="btn block" style="margin-top:12px" id="qsync">ส่งตอนนี้</button>' : ''}`);
  bg.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (await ask('ลบรายการนี้? รายการจะไม่ถูกบันทึกเข้าระบบ', { yes: 'ลบ', danger: true })) { Q.splice(+b.dataset.del, 1); saveQ(); queueSheet(); } });
  if ($('#qsync')) $('#qsync').onclick = async () => { Q.forEach(x => { if (x.status === 'failed') x.status = 'pending'; }); await syncQueue(); queueSheet(); };
}

async function resetDemo() { if (await ask('ล้างข้อมูลทดลองทั้งหมด?', { yes: 'ล้าง', danger: true })) { LS.del('ms_demo_db4'); LS.del('ms_queue'); Object.keys(MEM).forEach(k => { if (/^ms_(state|cart)_/.test(k)) delete MEM[k]; }); try { Object.keys(localStorage).filter(k => /^ms_(state|cart)_/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); } }
/* ================== start ================== */
if (!API) screenSetup();
else if (S && S.event_id) { CART = LS.get('ms_cart_' + S.event_id, []); screenMain(); syncQueue(); }
else if (S) screenEvents();
else screenLogin();
</script>
</body>
