:root{
  /* Minana CI: Glaucous #5C80B3 · White · Platinum #E6E6E6 · Amaranth Pink #E9A4B4 */
  --bg:#F3F6FA;--card:#ffffff;--ink:#23324A;--mute:#6B7A90;--line:#E1E7EF;--plat:#E6E6E6;
  --brand:#5C80B3;--brand-ink:#ffffff;--brand-soft:#E8EEF7;--pink:#E9A4B4;
  --gift:#B5546E;--gift-soft:#FBE8ED;--head:"STIX Two Text","LINE Seed Sans TH",Georgia,serif;--bad:#c23b3b;--bad-soft:#fbeaea;--warn:#a86b00;--warn-soft:#fff4dc;--ok:#2f7d4f;
  --r:14px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121722;--card:#1B2230;--ink:#E9EEF6;--mute:#9AA6B8;--line:#2A3344;--plat:#2A3344;
  --brand:#8FAAD3;--brand-ink:#0E1420;--brand-soft:#223049;--pink:#E9A4B4;--gift:#F0A7BA;--gift-soft:#3A2230;--head:"STIX Two Text","LINE Seed Sans TH",Georgia,serif;--bad:#f07272;--bad-soft:#3a1f1f;--warn:#f2b84b;--warn-soft:#3a2f17;--ok:#6cc792;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121722;--card:#1B2230;--ink:#E9EEF6;--mute:#9AA6B8;--line:#2A3344;--plat:#2A3344;
  --brand:#8FAAD3;--brand-ink:#0E1420;--brand-soft:#223049;--pink:#E9A4B4;--gift:#F0A7BA;--gift-soft:#3A2230;--head:"STIX Two Text","LINE Seed Sans TH",Georgia,serif;--bad:#f07272;--bad-soft:#3a1f1f;--warn:#f2b84b;--warn-soft:#3a2f17;--ok:#6cc792;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"LINE Seed Sans TH",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main.wrap{padding:14px 16px calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top))}
header.top .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top .ev{flex:1;min-width:0}
header.top .ev b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ev small{color:var(--mute);font-size:13px}
header.top .hlogo{height:24px;width:auto;display:block;flex:none}
header.top .ev b{color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.q{background:var(--warn);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
main{padding:14px 0 150px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

<body>
<div id="app"></div>
<script>
/* ===== MINANA Stock – core logic (ใช้ร่วมกันทั้ง Apps Script และโหมดทดลองในเบราว์เซอร์) =====
 * หลักการ: สต๊อกไม่ถูกเก็บเป็นตัวเลขคงเหลือ แต่คำนวณจากสมุดรายการ (Ledger) ที่เพิ่มต่อท้ายอย่างเดียว
 * - ทุกงาน/คลัง เป็น "location" ของตัวเอง  -> งานซ้อนกันไม่ปนกัน
 * - เบิก/คืน = 2 แถวคู่ (ออกจากที่หนึ่ง เข้าอีกที่)
 * - ทุกบิลมี client_id -> ส่งซ้ำ (เน็ตหลุดแล้วส่งใหม่) ไม่ถูกบันทึกซ้ำ
 */
var CORE = (function () {
  var SHEETS = {
    Products: ['barcode', 'name', 'color', 'category', 'price', 'active', 'image'],
    Staff: ['name', 'pin', 'role', 'active'],
    Events: ['event_id', 'name', 'store', 'start', 'end', 'status', 'created_at', 'closed_at', 'lead_days'],
    EventPrices: ['event_id', 'barcode', 'price', 'sell_ok', 'gift_ok'],
    Ledger: ['ts', 'client_id', 'bill_id', 'location', 'type', 'barcode', 'qty', 'unit_price', 'amount', 'pay', 'staff', 'note']
  };
  var WH = 'WH';
  var TYPE_LABEL = {
    SALE: 'ขาย', GIFT: 'แถม', XFER_IN: 'รับเข้า', XFER_OUT: 'ส่งออก',
    ADJ: 'ปรับยอด', VOID: 'ยกเลิกบิล'
  };

  function UserError(msg) { var e = new Error(msg); e.userError = true; return e; }
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function bool(v) { var s = str(v).toUpperCase(); return s === 'TRUE' || s === '1' || s === 'Y' || s === 'YES' || v === true; }
  function nowTH() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 19).replace('T', ' '); }
  var CLOCK = function () { return Date.now(); };
  var DAY = 864e5;
  function thDate(v) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str(v)); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) - 7 * 3600e3 : null; }
  function leadOf(ev) { var n = Math.round(num(ev.lead_days)); return n > 0 ? n : 2; }
  function packOf(p) { return /ผ้าอ้อม/.test(p.category + ' ' + p.name) ? 6 : 1; }
  /* เตือนเติมของ แบบ A (อัตโนมัติ): ใช้ยอดออกจริง (ขาย+แถม-ยกเลิก) ÷ จำนวนวันที่ผ่านไป */
  function refillPlan(ledger, ev, list) {
    var loc = str(ev.event_id), now = CLOCK(), lead = leadOf(ev);
    var t0 = thDate(ev.start), t1 = thDate(ev.end);
    var used = {};
    ledger.forEach(function (r) {
      if (str(r.location) !== loc) return;
      if (r.type === 'SALE' || r.type === 'GIFT' || r.type === 'VOID') { var b = str(r.barcode); used[b] = (used[b] || 0) - num(r.qty); }
    });
    var end = t1 != null ? t1 + DAY : null;
    var elapsed = t0 == null ? 1 : Math.max(0.5, ((end != null ? Math.min(now, end) : now) - t0) / DAY);
    var left = end == null ? null : Math.max(0, (end - now) / DAY);
    var horizon = left == null ? lead + 1 : left;
    var items = [];
    list.forEach(function (p) {
      var u = Math.max(0, used[p.barcode] || 0), v = u / elapsed, pk = packOf(p);
      p.used = u; p.per_day = Math.round(v * 100) / 100; p.pack = pk;
      p.days_cover = v > 0 ? Math.round(Math.max(0, p.stock) / v * 10) / 10 : null;
      p.left_end = left == null ? null : Math.round(p.stock - v * left);
      p.refill = 0;
      if (v <= 0 || horizon <= 0) return;
      var thr = Math.ceil(v * lead), need = Math.ceil(v * horizon - p.stock);
      if (p.stock <= thr && need > 0) { p.refill = Math.ceil(need / pk) * pk; p.alert_at = thr; items.push(p.barcode); }
    });
    items.sort(function (a, b) {
      var A1 = list.filter(function (x) { return x.barcode === a; })[0], B1 = list.filter(function (x) { return x.barcode === b; })[0];
      return (A1.days_cover || 0) - (B1.days_cover || 0);
    });
    return { lead_days: lead, days_left: left == null ? null : Math.round(left * 10) / 10, days_elapsed: Math.round(elapsed * 10) / 10, alerts: items };
  }
  /* วันที่ของรายการ: แอดมินลงย้อนหลังได้ทุกวัน · PC ใช้เวลาเครื่อง (สำหรับบิลออฟไลน์) ได้ไม่เกิน 2 วัน */
  function pickTs(p, u) {
    var t = str(p.ts);
    if (!/^\d{4}-\d{2}-\d{2}/.test(t)) return nowTH();
    if (t.length === 10) t += ' 12:00:00';
    if (u && u.role === 'admin') return t;
    var d = thDate(t);
    return d != null && CLOCK() - d <= 2 * DAY ? t : nowTH();
  }
  function rid(p) { return p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }

  function auth(db, p, adminOnly) {
    var s = db.read('Staff').filter(function (r) {
      return str(r.name) === str(p.staff) && str(r.active).toUpperCase() !== 'FALSE';
    })[0];
    if (!s || str(s.pin) !== str(p.pin)) throw UserError('ชื่อหรือ PIN ไม่ถูกต้อง');
    var role = str(s.role).toLowerCase() || 'pc';
    if (adminOnly && role !== 'admin') throw UserError('ต้องใช้สิทธิ์แอดมิน');
    return { name: str(s.name), role: role };
  }

  function getEvent(db, id) {
    var ev = db.read('Events').filter(function (r) { return str(r.event_id) === str(id); })[0];
    if (!ev) throw UserError('ไม่พบงาน ' + id);
    return ev;
  }
  function requireOpen(ev) { if (str(ev.status) !== 'open') throw UserError('งาน "' + ev.name + '" ปิดแล้ว บันทึกเพิ่มไม่ได้'); }

  function products(db) {
    var m = {};
    db.read('Products').forEach(function (r) {
      var b = str(r.barcode); if (!b) return;
      m[b] = { barcode: b, name: str(r.name), color: str(r.color), category: str(r.category), price: num(r.price), active: str(r.active).toUpperCase() !== 'FALSE', image: str(r.image), _row: r._row };
    });
    return m;
  }

  function stockAt(ledger, loc) {
    var s = {};
    ledger.forEach(function (r) { if (str(r.location) === loc) { var b = str(r.barcode); s[b] = (s[b] || 0) + num(r.qty); } });
    return s;
  }

  function seenClient(ledger, cid) {
    if (!cid) return null;
    for (var i = ledger.length - 1; i >= 0; i--) if (str(ledger[i].client_id) === cid) return ledger[i];
    return null;
  }

  function cleanItems(items) {
    var out = [];
    (items || []).forEach(function (it) {
      var q = Math.round(num(it.qty));
      if (str(it.barcode) && q > 0) out.push({ barcode: str(it.barcode), qty: q, mode: it.mode === 'gift' ? 'gift' : 'sale' });
    });
    if (!out.length) throw UserError('ยังไม่มีรายการสินค้า');
    return out;
  }

  /* ---------- actions ---------- */
  var A = {};

  A.bootstrap = function (db) {
    return {
      staff: db.read('Staff').filter(function (r) { return str(r.name) && str(r.active).toUpperCase() !== 'FALSE'; }).map(function (r) { return str(r.name); }),
      events: db.read('Events').filter(function (r) { return str(r.status) === 'open'; }).map(function (r) { return { event_id: str(r.event_id), name: str(r.name), store: str(r.store), start: str(r.start), end: str(r.end) }; })
    };
  };

  A.login = function (db, p) { var u = auth(db, p); return { user: u }; };

  A.events = function (db, p) {
    auth(db, p);
    return { events: db.read('Events').map(function (r) { return { event_id: str(r.event_id), name: str(r.name), store: str(r.store), start: str(r.start), end: str(r.end), status: str(r.status) }; }) };
  };

  A.state = function (db, p) {
    auth(db, p);
    var ev = getEvent(db, p.event_id);
    var pm = products(db), ledger = db.read('Ledger');
    var st = stockAt(ledger, str(ev.event_id)), wh = stockAt(ledger, WH);
    var prices = {};
    db.read('EventPrices').forEach(function (r) { if (str(r.event_id) === str(ev.event_id)) prices[str(r.barcode)] = r; });
    var list = [];
    Object.keys(pm).forEach(function (b) {
      var pr = prices[b], prod = pm[b];
      var inEvent = !!pr || (st[b] || 0) !== 0;
      if (!inEvent) return;
      list.push({
        barcode: b, name: prod.name, color: prod.color, category: prod.category,
        price: pr ? num(pr.price) : 0, sell_ok: prod.active && pr ? bool(pr.sell_ok) && num(pr.price) > 0 : false,
        gift_ok: prod.active && pr ? bool(pr.gift_ok) : false, active: prod.active, stock: st[b] || 0, wh: wh[b] || 0
      });
    });
    var plan = refillPlan(ledger, ev, list);
    return { event: { event_id: str(ev.event_id), name: str(ev.name), store: str(ev.store), start: str(ev.start), end: str(ev.end), status: str(ev.status), lead_days: leadOf(ev) }, products: list, refill: plan, summary: summarize(ledger, str(ev.event_id), pm), server_time: nowTH() };
  };

  A.sell = function (db, p) {
    var u = auth(db, p);
    return db.lock(function () {
      var ledger = db.read('Ledger');
      var dup = seenClient(ledger, str(p.client_id));
      if (dup) return { duplicate: true, bill_id: str(dup.bill_id) };
      var ev = getEvent(db, p.event_id); requireOpen(ev);
      var items = cleanItems(p.items), pm = products(db), prices = {};
      db.read('EventPrices').forEach(function (r) { if (str(r.event_id) === str(ev.event_id)) prices[str(r.barcode)] = r; });
      var st = stockAt(ledger, str(ev.event_id)), need = {}, warnings = [];
      var bill = rid('B'), ts = pickTs(p, u), rows = [];
      items.forEach(function (it) {
        var pr = prices[it.barcode], prod = pm[it.barcode];
        if (!prod) throw UserError('ไม่พบสินค้า ' + it.barcode);
        if (!prod.active) throw UserError(prod.name + ' ' + prod.color + ' ถูกซ่อน (ไม่ได้เปิดขาย)');
        if (!pr) throw UserError(prod.name + ' ' + prod.color + ' ยังไม่ได้ตั้งราคาในงานนี้');
        var price = num(pr.price);
        if (it.mode === 'sale' && !(bool(pr.sell_ok) && price > 0)) throw UserError(prod.name + ' ' + prod.color + ' ตั้งไว้ว่าไม่ขายในงานนี้');
        if (it.mode === 'gift' && !bool(pr.gift_ok)) throw UserError(prod.name + ' ' + prod.color + ' ตั้งไว้ว่าไม่ใช่ของแถม');
        need[it.barcode] = (need[it.barcode] || 0) + it.qty;
        var unit = it.mode === 'sale' ? price : 0;
        rows.push({ ts: ts, client_id: str(p.client_id), bill_id: bill, location: str(ev.event_id), type: it.mode === 'sale' ? 'SALE' : 'GIFT', barcode: it.barcode, qty: -it.qty, unit_price: unit, amount: unit * it.qty, pay: it.mode === 'sale' ? str(p.pay) || 'เงินสด' : '', staff: u.name, note: str(p.note) });
      });
      Object.keys(need).forEach(function (b) {
        var left = (st[b] || 0) - need[b];
        if (left < 0) warnings.push(pm[b].name + ' ' + pm[b].color + ' สต๊อกติดลบ ' + left + ' (ลืมบันทึกเติมของ?)');
      });
      db.append('Ledger', rows);
      return { bill_id: bill, total: rows.reduce(function (a, r) { return a + r.amount; }, 0), warnings: warnings };
    });
  };

  /* เบิกของเข้างาน (from=WH) หรือส่งคืนคลัง (to=WH) – บันทึกเป็นคู่เสมอ */

<script>
/* ================== config & storage ================== */

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set(k, v) { MEM[k] = JSON.stringify(v); try { localStorage.setItem(k, MEM[k]); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

const $ = s => document.querySelector(s);
const hit = (q, ...f) => { const t = f.join(' ').toLowerCase(); return String(q || '').toLowerCase().split(/\s+/).filter(Boolean).every(w => t.includes(w)); };

async function loadUploadedImages(force) {
  try {
    const all = await ensureProducts(force);
    const need = all.filter(p => p.has_image && (force || !UPIMG[p.barcode])).map(p => p.barcode);
    if (!need.length) return;
    const r = await api(Object.assign({ action: 'images', barcodes: need }, auth()));
    if (r.ok) { Object.assign(UPIMG, r.images); LS.set('ms_upimg', UPIMG); if (ST) renderView(); }
  } catch (e) {}
}
const IMG_BASE = 'img/';   // รูปสินค้าในโฟลเดอร์ img/ ชื่อไฟล์ = บาร์โค้ด.jpg
function thumb(b, name, small) {
  const src = UPIMG[b] || IMGS[b] || (IMGS.__none ? '' : IMG_BASE + encodeURIComponent(b) + '.jpg');
  const rest = String(name || '?').replace(/^(ผ้าอ้อมเด็ก|ผ้าอ้อม|รถเข็นเด็ก|รถเข็น|กระเป๋า|เก้าอี้|เบาะรองนั่ง)\s*/, '');
  const code = rest.match(/[A-Za-z0-9]+/);
  const ini = esc(code && /\d/.test(code[0]) ? code[0].slice(0, 4) : rest.slice(0, 2));
  return `<div class="thumb ${small ? 's' : ''}">${src ? `<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.textContent='${ini}'">` : ini}</div>`;
}

/* ================== api ================== */
class NetErr extends Error {}
async function api(p, quiet) {
  if (API === 'demo') { await new Promise(r => setTimeout(r, 120)); return JSON.parse(JSON.stringify(CORE.handle(demoDb(), p))); }
  let r;
  try {
    r = await fetch(API, { method: 'POST', body: JSON.stringify(p), redirect: 'follow' });
  } catch (e) { throw new NetErr('ออฟไลน์'); }
  if (!r.ok) throw new NetErr('เซิร์ฟเวอร์ตอบกลับ ' + r.status);
  try { return await r.json(); } catch (e) { throw new NetErr('อ่านข้อมูลจากเซิร์ฟเวอร์ไม่ได้'); }
}
const auth = () => ({ staff: S.staff, pin: S.pin });

/* ================== offline queue ================== */
function saveQ() { LS.set('ms_queue', Q); renderHeader(); }
let syncing = false;
async function syncQueue() {
  if (syncing || !Q.length) return;
  syncing = true;
  try {
    for (const item of Q.filter(x => x.status === 'pending')) {
      let res;
      try { res = await api(item.payload); } catch (e) { break; }
      if (res.ok) { Q = Q.filter(x => x !== item); if (res.warnings && res.warnings.length) toast('⚠️ ' + res.warnings[0]); }
      else { item.status = 'failed'; item.error = res.error; }
      saveQ();
    }
  } finally { syncing = false; }
  if (S && S.event_id) loadState(true);
}
window.addEventListener('online', syncQueue);
setInterval(() => { syncQueue(); if (S && S.event_id && TAB === 'sell' && !document.hidden && !$('.sheet-bg')) loadState(true); }, 30000);

/* ================== ui helpers ================== */
let toastT;
function toast(m, ms) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = m; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', ms || 2600); }
function sheet(html) { closeSheet(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = '<div class="sheet">' + html + '</div>'; bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); }); document.body.appendChild(bg); return bg; }
function closeSheet() { stopScan(); document.querySelectorAll('.sheet-bg:not(.ask-bg)').forEach(x => x.remove()); }
function ask(msg, opt) {
  opt = opt || {};
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg ask-bg';
    bg.innerHTML = `<div class="sheet" style="max-width:440px;border-radius:18px;margin:auto 12px">
      <p style="white-space:pre-line;margin:4px 0 12px;font-weight:600">${esc(msg)}</p>
      ${opt.input ? '<input type="text" id="askin" placeholder="' + esc(opt.placeholder || '') + '">' : ''}
      <div class="row2" style="margin-top:14px"><button class="btn line" data-r="0">${esc(opt.no || 'ยกเลิก')}</button><button class="btn ${opt.danger ? 'danger' : ''}" data-r="1">${esc(opt.yes || 'ตกลง')}</button></div></div>`;
    bg.style.alignItems = 'center';
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    bg.querySelector('[data-r="0"]').onclick = () => done(opt.input ? null : false);
    bg.querySelector('[data-r="1"]').onclick = () => done(opt.input ? (bg.querySelector('#askin').value || '') : true);
    if (opt.input) setTimeout(() => bg.querySelector('#askin').focus(), 50);

/* ================== screens: setup / login / event ================== */
function screenSetup() {
  $('#app').innerHTML = `<div class="center"><div class="login card">
    ${BRAND}<p class="muted small" style="text-align:center;margin-top:0">ตั้งค่าครั้งแรก</p>
    <label class="f">URL ของระบบ (Apps Script Web App)</label>
    <input type="url" id="apiurl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API && API !== 'demo' ? API : '')}">
    <button class="btn block" style="margin-top:12px" id="saveapi">บันทึก</button>
    <button class="btn line block" style="margin-top:8px" id="demo">ลองใช้โหมดทดลอง (ข้อมูลอยู่ในเครื่องนี้)</button>
  </div></div>`;
  $('#saveapi').onclick = async () => {
    const u = $('#apiurl').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return toast('URL ต้องขึ้นต้นด้วย https://script.google.com/');
    API = u; LS.set('ms_api', u); screenLogin();
  };
  $('#demo').onclick = () => { API = 'demo'; LS.set('ms_api', 'demo'); screenLogin(); };
}

let BOOT = null;
async function screenLogin() {
  $('#app').innerHTML = `<div class="center"><div class="login">${BRAND}<p class="muted" style="text-align:center;margin:0 0 14px">กำลังโหลด…</p></div></div>`;
  try { BOOT = await api({ action: 'bootstrap' }); } catch (e) { BOOT = null; }
  if (!BOOT || !BOOT.ok) {
    $('#app').innerHTML = `<div class="center"><div class="login card">${BRAND}
      <div class="alert bad">${esc(BOOT ? BOOT.error : 'ต่อระบบไม่ได้ – เช็กอินเทอร์เน็ตหรือ URL')}</div>
      <button class="btn block" onclick="screenLogin()">ลองใหม่</button>
      <button class="btn line block" style="margin-top:8px" onclick="screenSetup()">ตั้งค่า URL</button></div></div>`;
    return;
  }
  let pin = '', who = (S && S.staff) || '';
  const draw = () => {
    $('#app').innerHTML = `<div class="center"><div class="login">
      ${BRAND}
      <p class="muted" style="text-align:center;margin:0 0 16px">ระบบสต๊อก · งานอีเวนต์ & ห้าง${API === 'demo' ? ' · <b>โหมดทดลอง</b>' : ''}</p>
      <div class="card">
        <label class="f" style="margin-top:0">ชื่อผู้ใช้</label>
        <select id="who"><option value="">— เลือกชื่อ —</option>${BOOT.staff.map(n => `<option ${n === who ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div>
        <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>
      </div>
      <p class="small muted" style="text-align:center"><a href="#" onclick="screenSetup();return false" style="color:inherit">ตั้งค่า</a></p>
    </div></div>`;
    $('#who').onchange = e => { who = e.target.value; };
    document.querySelectorAll('.pinpad button').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
      if (pin.length === 4) {
        if (!who) { pin = ''; draw(); return toast('เลือกชื่อก่อน'); }
        try {
          const r = await api({ action: 'login', staff: who, pin });
          if (!r.ok) { pin = ''; draw(); return toast(r.error); }
          S = { staff: who, pin, role: r.user.role, event_id: null }; LS.set('ms_session', S);
          screenEvents();
        } catch (e) { pin = ''; draw(); toast('ต่อระบบไม่ได้'); }
        return;
      }
      draw();
    });
  };
  draw();
}

async function screenEvents() {
  $('#app').innerHTML = `<div class="wrap" style="padding-top:24px"><h2>เลือกงานที่ประจำวันนี้</h2><p class="muted">กำลังโหลด…</p></div>`;
  let evs = [];
  try {
    if (S.role === 'admin') { const r = await api(Object.assign({ action: 'events' }, auth())); evs = r.events || []; }
    else { const r = await api({ action: 'bootstrap' }); evs = (r.events || []).map(e => Object.assign({ status: 'open' }, e)); }
  } catch (e) { return toast('ต่อระบบไม่ได้'); }
  const open = evs.filter(e => e.status === 'open'), closed = evs.filter(e => e.status !== 'open').slice(-10).reverse();
  $('#app').innerHTML = `<div class="wrap" style="padding-top:24px;padding-bottom:40px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">สวัสดี ${esc(S.staff)}</h2><button class="btn line" onclick="logout()">ออก</button></div>
    <p class="muted">เลือกงานที่คุณประจำ – เครื่องนี้จะบันทึกยอดเข้างานนี้เท่านั้น</p>
    <div class="evlist">${open.map(e => `<button data-id="${esc(e.event_id)}"><b>${esc(e.name)}</b><span class="muted small">${esc(e.store)} · ${esc(e.start)} ถึง ${esc(e.end)}</span></button>`).join('') || '<div class="empty">ยังไม่มีงานที่เปิดอยู่' + (S.role === 'admin' ? '<br><br><button class="btn" onclick="S.event_id=null;TAB=\'admin\';newEventSheet()">+ สร้างงานใหม่</button>' : ' – ติดต่อแอดมิน') + '</div>'}</div>
    ${S.role === 'admin' && open.length ? '<button class="btn ghost block" onclick="newEventSheet()">+ สร้างงานใหม่</button>' : ''}
    ${closed.length ? `<h3>งานที่ปิดแล้ว (ดูสรุป)</h3><div class="evlist">${closed.map(e => `<button data-id="${esc(e.event_id)}" style="opacity:.75"><b>${esc(e.name)}</b><span class="muted small">ปิดแล้ว · ${esc(e.start)}–${esc(e.end)}</span></button>`).join('')}</div>` : ''}
  </div>`;
  document.querySelectorAll('.evlist button[data-id]').forEach(b => b.onclick = () => {
    S.event_id = b.dataset.id; LS.set('ms_session', S); CART = LS.get('ms_cart_' + S.event_id, []); TAB = 'sell'; screenMain();
  });
}
async function logout(force) { if (!force && CART.length && !(await ask('มีของในตะกร้า ออกจากระบบเลยไหม?', { yes: 'ออกจากระบบ' }))) return; S = null; ADATE = ''; LS.del('ms_session'); CART = []; ST = null; screenLogin(); }
async function switchEvent() { closeSheet(); if (CART.length && !(await ask('มีของในตะกร้า เปลี่ยนงานเลยไหม?', { yes: 'เปลี่ยนงาน' }))) return; S.event_id = null; LS.set('ms_session', S); ST = null; screenEvents(); }

/* ================== main ================== */
function screenMain() {
  setTimeout(() => loadUploadedImages(), 800);
  $('#app').innerHTML = `<header class="top"><div class="row" id="hdr"></div></header><main class="wrap" id="view"></main><div id="cartbar"></div><nav class="tabs"><div class="row" id="tabs"></div></nav>`;
  renderHeader(); renderTabs(); renderView(); loadState();
}
function renderHeader() {

function resizeImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const N = 240, c = document.createElement('canvas'); c.width = N; c.height = N; const x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, N, N);
      const k = Math.min(N / im.width, N / im.height); const w = im.width * k, h = im.height * k;
      x.drawImage(im, (N - w) / 2, (N - h) / 2, w, h); res(c.toDataURL('image/jpeg', 0.75));
    }; im.onerror = () => rej(new Error('เปิดรูปไม่ได้')); im.src = fr.result; };
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); fr.readAsDataURL(file);
  });
}

    <div style="display:flex;gap:12px;align-items:center"><div id="pimg">${thumb(p.barcode, p.name)}</div><label class="btn ghost" style="flex:1">📷 ${isNew ? 'ใส่รูป' : 'เปลี่ยนรูป'}<input type="file" accept="image/*" id="pfile" class="hide"></label></div>
    <label class="f">บาร์โค้ด</label><input type="text" inputmode="numeric" id="pbc" value="${esc(p.barcode)}" ${isNew ? '' : 'disabled'} placeholder="13 หลัก เช่น 8851310209155">
    <div class="small" id="pbcmsg" style="min-height:18px;color:var(--bad)"></div>
    <label class="f" style="margin-top:2px">ชื่อสินค้า</label><input type="text" id="pnm" value="${esc(p.name)}" placeholder="เช่น รถเข็นเด็ก V16">
    <div class="row2"><div><label class="f">สี / ไซซ์ / ลาย</label><input type="text" id="pcl" value="${esc(p.color)}" placeholder="เช่น สีขาว"></div>
    <div><label class="f">ราคาตั้งต้น (บาท)</label><input type="number" inputmode="numeric" id="ppr" value="${p.price || ''}"></div></div>
    <label class="f">หมวด</label><input type="text" id="pct" list="pcats" value="${esc(p.category)}" placeholder="เลือกหรือพิมพ์หมวดใหม่"><datalist id="pcats">${catsAll.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    ${isNew ? '' : `<label class="chk" style="margin-top:14px;font-size:16px"><input type="checkbox" id="pact" ${p.active ? 'checked' : ''}> แสดงในแอป <span class="muted small">(เอาติ๊กออก = ซ่อนจากทุกงาน เช่น เลิกขาย / ยังไม่ลงห้าง)</span></label>`}
    <button class="btn block" style="margin-top:16px" id="psv">${isNew ? 'เพิ่มสินค้า' : 'บันทึก'}</button>
    <p class="small muted">ราคาตั้งต้นใช้ตอนสร้างงานใหม่ ราคาในงานที่เปิดอยู่แก้ที่ แอดมิน › ราคา</p>`);
  const bc = bg.querySelector('#pbc');
  if (isNew) bc.oninput = () => { const v = bc.value.trim(); const ex = all.find(x => x.barcode === v); bg.querySelector('#pbcmsg').textContent = ex ? 'มีอยู่แล้ว: ' + ex.name + ' ' + ex.color : (!eanOk(v) ? 'หลักสุดท้ายไม่ถูกต้อง ตรวจเลขอีกครั้ง' : ''); };
  bg.querySelector('#pfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { img = await resizeImage(f); bg.querySelector('#pimg').innerHTML = `<div class="thumb"><img src="${img}" alt=""></div>`; } catch (err) { toast(err.message); }
  };
  bg.querySelector('#psv').onclick = async () => {
    const o = Object.assign({ action: 'saveProduct', is_new: isNew, barcode: bc.value.trim(), name: bg.querySelector('#pnm').value.trim(), color: bg.querySelector('#pcl').value.trim(), category: bg.querySelector('#pct').value.trim() || 'อื่นๆ', price: Number(bg.querySelector('#ppr').value) || 0 }, auth());
    if (!isNew) o.active = bg.querySelector('#pact').checked;
    if (img) o.image = img;
    if (!o.barcode || !o.name) return toast('ใส่บาร์โค้ดและชื่อสินค้า');
    if (!eanOk(o.barcode)) return toast('บาร์โค้ดหลักสุดท้ายไม่ถูกต้อง');
    if (!isNew && !o.active && p.active && !(await ask(p.name + ' ' + p.color + '\nซ่อนสินค้านี้?\nจะหายจากหน้าขายทุกงาน แต่ยอดและประวัติยังอยู่ครบ', { yes: 'ซ่อน', danger: true }))) return;
    const btn = bg.querySelector('#psv'); btn.disabled = true;
    const r = await api(o);
    if (!r.ok) { btn.disabled = false; return toast(r.error, 4000); }
    if (img) { UPIMG[o.barcode] = img; LS.set('ms_upimg', UPIMG); }
    closeSheet(); toast(isNew ? 'เพิ่มสินค้าแล้ว' : 'บันทึกแล้ว'); await ensureProducts(true); await loadState(true); TAB = 'admin'; ASUB = 'prod'; renderTabs(); viewAdmin();
  };
}
async function adminCount() {
  let rows;
  if (CLOC === 'event') rows = ST.products.map(p => ({ barcode: p.barcode, name: p.name, color: p.color, qty: p.stock }));
  else { const r = await api(Object.assign({ action: 'warehouse' }, auth())); const all = await ensureProducts(); const wh = {}; (r.warehouse || []).forEach(x => wh[x.barcode] = x.qty); rows = all.map(p => ({ barcode: p.barcode, name: p.name, color: p.color, qty: wh[p.barcode] || 0, cat: p.category })); }
  $('#asub').innerHTML = `<div class="card"><div class="seg"><button class="${CLOC === 'event' ? 'on' : ''}" data-l="event">นับในงานนี้</button><button class="${CLOC === 'WH' ? 'on' : ''}" data-l="WH">นับคลัง</button></div>
    <p class="small muted">ใส่จำนวนที่นับได้จริงเฉพาะรายการที่นับ ระบบจะบันทึก "ปรับยอด" ส่วนต่างให้ (ช่องว่าง = ไม่ปรับ)</p>
    <table><tr><th>สินค้า</th><th class="n">ในระบบ</th><th class="n" style="width:90px">นับได้</th></tr>
    ${rows.map(x => `<tr><td>${esc(x.name)} <span class="muted">${esc(x.color)}</span></td><td class="n">${x.qty}</td><td><input type="number" inputmode="numeric" data-b="${x.barcode}" value="${CNT[x.barcode] ?? ''}" style="min-height:38px;padding:4px 8px;text-align:right"></td></tr>`).join('')}</table>
    <button class="btn block" style="position:sticky;bottom:70px;margin-top:12px" id="csave">บันทึกการนับ</button></div>`;
  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { CLOC = b.dataset.l; CNT = {}; adminCount(); });
  document.querySelectorAll('#asub input[data-b]').forEach(i => i.oninput = () => { if (i.value === '') delete CNT[i.dataset.b]; else CNT[i.dataset.b] = i.value; });
  $('#csave').onclick = async () => {
    const items = Object.keys(CNT).map(b => ({ barcode: b, counted: CNT[b] }));
    if (!items.length) return toast('ยังไม่ได้ใส่ยอดนับ');
    if (!(await ask('ปรับยอด ' + items.length + ' รายการให้ตรงกับที่นับ?', { yes: 'ปรับยอด' }))) return;
    const r = await api(Object.assign({ action: 'count', location: CLOC === 'event' ? S.event_id : 'WH', items, note: 'นับสต๊อก' }, auth()));
    if (!r.ok) return toast(r.error); CNT = {}; toast('ปรับยอดแล้ว ' + r.adjusted + ' รายการ'); await loadState(true); TAB = 'admin'; renderTabs(); viewAdmin();
  };
}
async function adminEvent() {
  const e = ST.event;
  $('#asub').innerHTML = `<div class="card"><h2 style="margin-top:0">${esc(e.name)}</h2><p class="muted small">${esc(e.store)} · ${esc(e.start)} ถึง ${esc(e.end)} · รหัส ${esc(e.event_id)} · ${e.status === 'open' ? 'เปิดอยู่' : 'ปิดแล้ว'}</p>
    ${e.status === 'open' ? `<label class="f" for="lead">เตือนเติมของ: คลังส่งของถึงบูธในกี่วัน</label><div style="display:flex;gap:8px"><input type="number" inputmode="numeric" id="lead" min="1" max="14" value="${e.lead_days || 2}" style="flex:1"><button class="btn ghost" id="leadsave">บันทึก</button></div>
    <p class="small muted">ระบบเตือนเมื่อของที่เหลือจะหมดก่อนของจากคลังมาถึง และแนะนำจำนวนเบิกให้พอถึงวันปิดงาน</p>
    <button class="btn danger block" id="closeev">ปิดงาน + คืนของที่เหลือเข้าคลัง</button><p class="small muted">หลังปิด PC จะบันทึกเพิ่มไม่ได้ ของคงเหลือทุกตัวถูกโอนคืนคลังอัตโนมัติ (นับสต๊อกให้ตรงก่อนปิด)</p>` : `<button class="btn line block" id="reopen">เปิดงานอีกครั้ง</button>`}</div>
    <button class="btn ghost block" onclick="newEventSheet()">+ สร้างงานใหม่</button>`;
  if ($('#closeev')) $('#closeev').onclick = async () => {
    if (!(await ask('ปิดงาน "' + e.name + '" ?\nของที่เหลือในระบบจะคืนคลังทั้งหมด และ PC บันทึกเพิ่มไม่ได้', { yes: 'ปิดงาน', danger: true }))) return;
    const r = await api(Object.assign({ action: 'closeEvent', event_id: e.event_id }, auth()));
    if (!r.ok) return toast(r.error); toast('ปิดงานแล้ว คืนคลัง ' + r.returned_lines + ' รายการ'); loadState();
  };
  if ($('#leadsave')) $('#leadsave').onclick = async () => { const r = await api(Object.assign({ action: 'setLead', event_id: e.event_id, lead_days: $('#lead').value }, auth())); toast(r.ok ? 'บันทึกแล้ว: ' + r.lead_days + ' วัน' : r.error); if (r.ok) loadState(true); };
  if ($('#reopen')) $('#reopen').onclick = async () => { const r = await api(Object.assign({ action: 'reopenEvent', event_id: e.event_id }, auth())); toast(r.ok ? 'เปิดงานแล้ว' : r.error); loadState(); };
}
async function newEventSheet() {
  let evs = []; try { evs = (await api(Object.assign({ action: 'events' }, auth()))).events || []; } catch (e) {}
  const all = await ensureProducts().catch(() => []);
  const catsAll = [...new Set(all.filter(p => p.active).map(p => p.category))];
  const bg = sheet(`<div class="hd"><h2 style="margin:0">สร้างงานใหม่</h2><button class="btn line" onclick="closeSheet()">ปิด</button></div>
    <label class="f">ชื่องาน</label><input type="text" id="nn" placeholder="เช่น Central Baby Fair @ RS">
    <label class="f">ห้าง / สาขา</label><input type="text" id="ns" placeholder="เช่น CDS RS / RBS RY">
    <div class="row2"><div><label class="f">เริ่ม</label><input type="date" id="nd1"></div><div><label class="f">จบ</label><input type="date" id="nd2"></div></div>
    <label class="f" for="nlead">คลังส่งของถึงบูธในกี่วัน (ใช้เตือนเติมของ)</label><input type="number" inputmode="numeric" id="nlead" min="1" max="14" value="2">
    <label class="f">ราคาสินค้า</label>
    <div class="seg"><button class="on" data-s="cat">ใช้ราคาตั้งต้นตามหมวด</button><button data-s="copy">คัดลอกจากงานเดิม</button></div>
    <div id="srcA">${catsAll.map(c => `<label class="chk" style="margin:6px 0"><input type="checkbox" value="${esc(c)}" ${/ผ้าอ้อม|รถเข็น|เก้าอี้|กระเป๋า|เบาะ/.test(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>
    <div id="srcB" class="hide"><select id="ncopy">${evs.slice().reverse().map(e => `<option value="${esc(e.event_id)}">${esc(e.name)} (${esc(e.start)})</option>`).join('')}</select></div>
    <button class="btn block" style="margin-top:14px" id="ncreate">สร้างงาน</button>
    <p class="small muted">สร้างแล้วไปปรับราคาโปร / ติ๊กของแถม ได้ที่ แอดมิน › ราคา</p>`);
  let src = 'cat';
  bg.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { src = b.dataset.s; bg.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b)); $('#srcA').classList.toggle('hide', src !== 'cat'); $('#srcB').classList.toggle('hide', src !== 'copy'); });
  $('#ncreate').onclick = async () => {
    const p = Object.assign({ action: 'createEvent', name: $('#nn').value, store: $('#ns').value, start: $('#nd1').value, end: $('#nd2').value, lead_days: $('#nlead').value }, auth());
    if (!p.name || !p.start) return toast('ใส่ชื่องานและวันเริ่ม');
    if (src === 'copy') p.copy_from = $('#ncopy').value;
    else { const cs = [...bg.querySelectorAll('#srcA input:checked')].map(i => i.value); p.barcodes = all.filter(x => cs.includes(x.category)).map(x => x.barcode); }
    const r = await api(p); if (!r.ok) return toast(r.error);
    closeSheet(); S.event_id = r.event_id; LS.set('ms_session', S); CART = []; TAB = 'admin'; ASUB = 'price'; PCAT = 'ในงานนี้'; toast('สร้างงานแล้ว · ตั้งราคา ' + r.priced + ' รายการ'); screenMain();
  };
}
async function adminStats() {
  const r = await api(Object.assign({ action: 'stats' }, auth()));
  if (!r.ok) return toast(r.error);
  const evs = r.events.slice().reverse();
  const total = evs.reduce((a, e) => a + e.sales, 0);
  $('#asub').innerHTML = `<div class="kpis"><div class="kpi"><span>ยอดขายรวมทุกงาน</span><b>฿${fmt(total)}</b></div><div class="kpi"><span>จำนวนงาน</span><b>${evs.length}</b></div></div>
    <div class="card" style="padding:6px 10px"><h3 style="padding:0 4px">ทุกงาน</h3><div class="tblwrap"><table><tr><th>งาน</th><th class="n">ยอดขาย</th><th class="n">บิล</th><th class="n">ชิ้น</th><th class="n">แถม</th></tr>
    ${evs.map(e => `<tr><td><b>${esc(e.name)}</b><div class="small muted">${esc(e.store)} · ${esc(e.start)}${e.status === 'open' ? ' · 🟢 เปิด' : ''}</div><div class="small muted">ขายดี: ${e.top.map(t => esc(t.name + ' ' + t.color)).join(', ') || '-'}</div></td><td class="n">฿${fmt(e.sales)}</td><td class="n">${e.bills}</td><td class="n">${e.units}</td><td class="n">${e.gifts}</td></tr>`).join('')}</table></div></div>
    <div class="card" style="padding:6px 10px"><h3 style="padding:0 4px">สต๊อกคลัง (WH)</h3><table>${r.warehouse.map(x => `<tr><td>${esc(x.name)} <span class="muted">${esc(x.color)}</span></td><td class="n"><span class="stock ${stockCls(x.qty)}">${x.qty}</span></td></tr>`).join('') || '<tr><td class="muted">ยังไม่มียอดคลัง – ใช้ "นับสต๊อก › นับคลัง" ตั้งยอดเริ่มต้น</td></tr>'}</table></div>`;
}

/* ================== menu & queue ================== */
function menuSheet() {
  sheet(`<div class="hd"><h2 style="margin:0">เมนู</h2><button class="btn line" onclick="closeSheet()">ปิด</button></div>
    <button class="btn line block" onclick="closeSheet();loadState()">↻ ดึงข้อมูลล่าสุด</button>
    <button class="btn line block" style="margin-top:8px" onclick="switchEvent()">⇄ เปลี่ยนงาน</button>
    <button class="btn line block" style="margin-top:8px" onclick="queueSheet()">⏳ รายการรอส่ง (${Q.length})</button>
    <button class="btn line block" style="margin-top:8px" onclick="closeSheet();logout()">ออกจากระบบ</button>
    <p class="small muted" style="margin-top:14px">${API === 'demo' ? 'โหมดทดลอง – ข้อมูลอยู่ในเครื่องนี้ <a href="#" onclick="resetDemo();return false">ล้างข้อมูลทดลอง</a>' : 'เชื่อมต่อ Google Sheet'}</p>`);
}
function queueSheet() {
  const bg = sheet(`<div class="hd"><h2 style="margin:0">รายการรอส่ง</h2><button class="btn line" onclick="closeSheet()">ปิด</button></div>
    ${Q.map((x, i) => `<div class="ln"><div class="info"><b>${esc(x.label || x.payload.action)}</b><div class="small muted">${esc(x.created)} · ${x.status === 'pending' ? 'รอเน็ต' : '<span style="color:var(--bad)">ส่งไม่ผ่าน: ' + esc(x.error) + '</span>'}</div></div>${x.status === 'failed' ? `<button class="btn line" style="min-height:34px" data-del="${i}">ลบ</button>` : ''}</div>`).join('') || '<div class="empty">ไม่มีรายการค้าง</div>'}
    ${Q.length ? '<button class="btn block" style="margin-top:12px" id="qsync">ส่งตอนนี้</button>' : ''}`);
  bg.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (await ask('ลบรายการนี้? รายการจะไม่ถูกบันทึกเข้าระบบ', { yes: 'ลบ', danger: true })) { Q.splice(+b.dataset.del, 1); saveQ(); queueSheet(); } });
  if ($('#qsync')) $('#qsync').onclick = async () => { Q.forEach(x => { if (x.status === 'failed') x.status = 'pending'; }); await syncQueue(); queueSheet(); };
}

async function resetDemo() { if (await ask('ล้างข้อมูลทดลองทั้งหมด?', { yes: 'ล้าง', danger: true })) { LS.del('ms_demo_db5'); LS.del('ms_queue'); Object.keys(MEM).forEach(k => { if (/^ms_(state|cart)_/.test(k)) delete MEM[k]; }); try { Object.keys(localStorage).filter(k => /^ms_(state|cart)_/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); } }
/* ================== start ================== */
if (!API) screenSetup();
else if (S && S.event_id) { CART = LS.get('ms_cart_' + S.event_id, []); screenMain(); syncQueue(); }
else if (S) screenEvents();
else screenLogin();
</script>
</body>
</html>
